spring:
  application:
    name: mcp-shorten-url
  profiles:
    active: local_postgres

# Logging configuration
logging:
  level:
    root: INFO
    com.kerry.mcpshortenurl: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# Local environment (in-memory storage)
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.jetbrains.exposed.spring.autoconfigure.ExposedAutoConfiguration
---
# Local PostgreSQL environment
spring:
  config:
    activate:
      on-profile: local_postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_demo_db
    username: postgres
    password: password1
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true